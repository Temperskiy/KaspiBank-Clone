name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
    
    - name: Create Flutter project
      run: |
        flutter create --project-name=kaspi_clone --org=com.kaspi .
        cp lib/main.dart /tmp/main_backup.dart 2>/dev/null || true
        flutter create --project-name=kaspi_clone --org=com.kaspi --platforms=android --force .
        cp /tmp/main_backup.dart lib/main.dart 2>/dev/null || true
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build apk --debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kaspi-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
