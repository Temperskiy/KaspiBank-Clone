plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.kaspi.clone"
    compileSdk 35

    defaultConfig {
        applicationId "com.kaspi.clone"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "2.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
